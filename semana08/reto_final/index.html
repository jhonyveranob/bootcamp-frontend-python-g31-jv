<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto Dragon Ball</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  body { font-family: sans-serif; }
  .font-mono { font-family: monospace; }
</style>
</head>
<body class="bg-white text-neutral-900 min-h-screen">
  <main class="max-w-2xl mx-auto px-6 py-16">
    <!-- Encabezado -->
    <header class="mb-10 flex items-end justify-between gap-6">
      <div>
        <p class="font-mono text-xs text-bib tracking-widest uppercase mb-1">Peronajes de Dragon Ball</p>
        <h1 class="text-3xl font-semibold tracking-tight">Dragon Ball CRUD</h1>
      </div>
      <div class="text-right shrink-0">
        <p id="contador" class="text-3xl font-semibold leading-none">0</p>
        <p class="font-mono text-[11px] text-neutral-400 uppercase tracking-widest">personajes</p>
      </div>
    </header>
    <div class="flex gap-4">
   <!-- Formulario -->
   <form id="form" class="mb-12 border border-neutral-200 rounded-xl p-6" novalidate>
    <input type="hidden" id="personajeId">
    <p class="font-mono text-[11px] uppercase tracking-widest text-neutral-400 mb-4">nuevo personaje</p>
    <div class="flex flex-col gap-4 mb-4">
     <label class="block text-xs text-neutral-500 mb-1">
      Nombre
      <input
       id="nombre" type="text" placeholder="Goku"
       class="w-full border-b border-neutral-200 bg-transparent py-2 text-sm outline-none focus:border-neutral-900 transition-colors"
      >
     </label>
     <label class="block text-xs text-neutral-500 mb-1">
      Imagen (URL)
      <input
       id="imagen" type="text" placeholder="https://..."
       class="w-full border-b border-neutral-200 bg-transparent py-2 text-sm outline-none focus:border-neutral-900 transition-colors"
      >
     </label>
     <label class="block text-xs text-neutral-500 mb-1">
      Raza
      <input
       id="raza" type="text" placeholder="Saiyan"
       class="w-full border-b border-neutral-200 bg-transparent py-2 text-sm outline-none focus:border-neutral-900 transition-colors"
      >
     </label>
     <label class="block text-xs text-neutral-500 mb-1">
      Género
      <select
       id="genero"
       class="w-full border-b border-neutral-200 bg-transparent py-2 text-sm outline-none focus:border-neutral-900 transition-colors"
      >
       <option value="">Elegir</option>
       <option value="Male">Masculino</option>
       <option value="Female">Femenino</option>
      </select>
     </label>
    </div>
    <div class="flex flex-col items-center gap-4">
     <button
      type="submit" id="submitBtn"
      class="w-full bg-neutral-900 text-white text-sm font-medium px-6 py-2.5 rounded-full hover:bg-bib transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
     >
      + Agregar Personaje
     </button>
     <button
      type="button" id="cancelBtn"
      class="text-sm text-neutral-400 hover:text-neutral-900 transition-colors hidden"
     >
      Cancelar edición
     </button>
    </div>
   </form>
   <!-- Lista -->
   <section class="w-full">
    <div class="flex items-center justify-between mb-4">
     <h2 class="font-mono text-[11px] uppercase tracking-widest text-neutral-400">Lista de personajes</h2>
     <div class="h-px flex-1 bg-neutral-200 mx-4"></div>
    </div>
    <ul id="lista" class="space-y-3 mb-4">
    </ul>
    <div id="vacio" class="hidden text-center py-16 border border-dashed border-neutral-200 rounded-xl">
     <p class="text-lg font-semibold text-neutral-400 mb-1">Sin personajes aún</p>
     <p class="text-sm text-neutral-400">La lista está vacía. Agrega al primero.</p>
    </div>
    <p id="loading" class="hidden font-mono text-xs text-neutral-400 uppercase tracking-widest py-10 text-center">
     Cargando personajes...
    </p>
   </section>
  </div>
  </main>
 <footer>
  <p class="text-center text-xs text-neutral-400">
   <a href="https://github.com/victorvzn/bootcamp-frontend-python-g31-jv" target="_blank" class="hover:underline">
    Bootcamp Frontend  JHONY VERANO
   </a>
  </p>
 </footer>
  <script src="main.js"></script>
</body>
</html>
