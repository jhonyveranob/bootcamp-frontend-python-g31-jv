<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript + DOM</title>
</head>
<body>
    <h1> DOM (DOCUMENT OBJET MOL)</h1>
    <p>Es una representacion en forma de un arbol de una pagina web</p>
    <ul>
        <li>Leer contenido de la pagina</li>
        <li>Cambiar textos , atributos, estilos  dinamicamente</li>
        <li>Crea o eliminar elementos</li>
        <li>Escuchar eventos (Click, teclas, scroll, etc)</li>
    </ul>
    <script>
        console.log('Hola dom')
        console.log(document)
        console.log({document: document}) // Solo es para ver su contenido de objeto

        console.log(document.title) // Leemos el titulo de la pagina

        document.title="Mi nueva pagina" // L escritura de un nuevo titulo
    </script>
</body>
</html>
